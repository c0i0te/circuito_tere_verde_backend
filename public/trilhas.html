<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terê Verde Online - Trilhas</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/logotv.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="animated-page-title">

    <header>
        <div class="container">
            <a href="index.html" class="logo-with-image">
                <img src="images/logotv.svg" alt="Logo Projeto Terê Verde">
                <span>Terê Verde</span>
            </a>
            
            <nav>
                <ul>
                    <li><a href="trilhas.html">Trilhas</a></li>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="biodiversidade.html">Biodiversidade</a></li>
                    <li><a href="login.html" class="login-button">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-title">
            <div class="container">
                <h1>Trilhas Incríveis em Teresópolis</h1>
            </div>
        </section>

        <section class="content-page">
        <div class="container" id="trilhas-lista-publica">
            <!-- As trilhas serão carregadas dinamicamente via JavaScript -->
        </div>
    </section>
    </main>

    <!-- Modal de Edição de Trilha -->
    <div id="edicao-trilha-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Editar Trilha</h2>
            <form id="form-editar-trilha">
                <input type="hidden" id="edit-trilha-id">
                
                <div class="form-group">
                    <label for="edit-trilha-nome">Nome da Trilha:</label>
                    <input type="text" id="edit-trilha-nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="edit-trilha-dif">Dificuldade:</label>
                    <select id="edit-trilha-dif" name="dificuldade" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 8px; font-family: 'Poppins'; font-size: 0.95rem;" required>
                        <option value="Leve">Leve</option>
                        <option value="Moderada">Moderada</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-trilha-desc">Descrição da Trilha:</label>
                    <textarea id="edit-trilha-desc" name="descricao" rows="3" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 8px; font-family: 'Poppins'; font-size: 0.95rem;" required></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-trilha-img">Alterar Imagem (Opcional):</label>
                    <input type="file" id="edit-trilha-img" name="imagem" accept="image/*">
                </div>
                
                <button type="submit" class="button">Salvar Alterações</button>
            </form>
            
            <div id="edit-trilha-status" class="login-status-message"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Terê Verde Online. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
