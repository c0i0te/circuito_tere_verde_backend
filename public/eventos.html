<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terê Verde Online - Eventos</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/logotv.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="animated-page-title">

    <header>
        <div class="container">
            <a href="index.html" class="logo-with-image">
                <img src="images/logotv.svg" alt="Logo Projeto Terê Verde">
                <span>Terê Verde</span>
            </a>
            
            <nav>
                <ul>
                    <li><a href="trilhas.html">Trilhas</a></li>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="biodiversidade.html">Biodiversidade</a></li>
                    <li><a href="login.html" class="login-button">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
    <section class="page-title">
        <div class="container">
            <h1>Próximos Eventos</h1>
        </div>
    </section>

    <section class="content-page">
        <div class="container event-container" id="eventos-lista-publica">
            <!-- Os eventos serão carregados dinamicamente via JavaScript -->
        </div>
    </section>
</main>

    <!-- Modal de Inscrição em Eventos -->
    <div id="inscricao-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Inscrição no Evento</h2>
            <p id="evento-selecionado-nome" class="evento-destaque-nome">Carregando evento...</p>
            
            <form id="form-inscricao">
                <input type="hidden" id="evento-titulo" name="eventoTitulo">
                
                <div class="form-group">
                    <label for="inscrito-nome">Nome Completo:</label>
                    <input type="text" id="inscrito-nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
                <div class="form-group">
                    <label for="inscrito-email">E-mail:</label>
                    <input type="email" id="inscrito-email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="inscrito-telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="inscrito-telefone" name="telefone" placeholder="(21) 99999-9999" required>
                </div>
                <div class="form-group">
                    <label for="inscrito-idade">Idade:</label>
                    <input type="number" id="inscrito-idade" name="idade" min="1" max="120" placeholder="Sua idade" required>
                </div>
                <div class="form-group">
                    <label for="inscrito-endereco">Endereço Completo:</label>
                    <input type="text" id="inscrito-endereco" name="endereco" placeholder="Rua, Número, Bairro, Cidade - UF" required>
                </div>
                
                <button type="submit" class="button">Confirmar Inscrição</button>
            </form>
            
            <!-- Div para mensagens de status (loading/sucesso/erro) -->
            <div id="inscricao-status" class="login-status-message"></div>
        </div>
    </div>

    <!-- Modal de Edição de Evento -->
    <div id="edicao-evento-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Editar Evento</h2>
            <form id="form-editar-evento">
                <input type="hidden" id="edit-evento-id">
                
                <div class="form-group">
                    <label for="edit-evento-titulo">Título do Evento:</label>
                    <input type="text" id="edit-evento-titulo" name="titulo" required>
                </div>
                <div class="form-group">
                    <label for="edit-evento-data">Data (Mês e Dia):</label>
                    <input type="text" id="edit-evento-data" name="data" required>
                </div>
                <div class="form-group">
                    <label for="edit-evento-desc">Descrição do Evento:</label>
                    <textarea id="edit-evento-desc" name="descricao" rows="3" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 8px; font-family: 'Poppins'; font-size: 0.95rem;" required></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-evento-img">Alterar Imagem (Opcional):</label>
                    <input type="file" id="edit-evento-img" name="imagem" accept="image/*">
                </div>
                
                <button type="submit" class="button">Salvar Alterações</button>
            </form>
            
            <div id="edit-evento-status" class="login-status-message"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Terê Verde Online. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
