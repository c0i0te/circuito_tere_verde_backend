<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terê Verde Online - Biodiversidade</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/logotv.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="animated-page-title">

    <header>
        <div class="container">
            <a href="index.html" class="logo-with-image">
                <img src="images/logotv.svg" alt="Logo Projeto Terê Verde">
                <span>Terê Verde</span>
            </a>
            
            <nav>
                <ul>
                    <li><a href="trilhas.html">Trilhas</a></li>
                    <li><a href="eventos.html">Eventos</a></li>
                    <li><a href="biodiversidade.html">Biodiversidade</a></li>
                    <li><a href="login.html" class="login-button">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-title">
            <div class="container">
                <h1>Biodiversidade de Teresópolis</h1>
            </div>
        </section>

        <section class="content-page">
        <div class="container">
            <h2 class="section-subtitle">Fauna</h2>
            <div class="gallery-grid" id="fauna-lista-publica">
                <!-- Os itens de Fauna serão carregados dinamicamente -->
            </div>

            <h2 class="section-subtitle">Flora</h2>
            <div class="gallery-grid" id="flora-lista-publica">
                <!-- Os itens de Flora serão carregados dinamicamente -->
            </div>
        </div>
    </section>
    </main>

    <!-- Modal de Edição de Biodiversidade -->
    <div id="edicao-bio-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Editar Biodiversidade</h2>
            <form id="form-editar-bio">
                <input type="hidden" id="edit-bio-id">
                
                <div class="form-group">
                    <label for="edit-bio-tipo">Categoria:</label>
                    <select id="edit-bio-tipo" name="categoria" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 8px; font-family: 'Poppins'; font-size: 0.95rem;" required>
                        <option value="Fauna">Fauna (Animais)</option>
                        <option value="Flora">Flora (Plantas)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-bio-nome">Nome da Espécie:</label>
                    <input type="text" id="edit-bio-nome" name="especie" required>
                </div>
                <div class="form-group">
                    <label for="edit-bio-desc">Descrição:</label>
                    <textarea id="edit-bio-desc" name="descricao" rows="3" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid rgba(0, 0, 0, 0.15); border-radius: 8px; font-family: 'Poppins'; font-size: 0.95rem;" required></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-bio-img">Alterar Imagem (Opcional):</label>
                    <input type="file" id="edit-bio-img" name="imagem" accept="image/*">
                </div>
                
                <button type="submit" class="button">Salvar Alterações</button>
            </form>
            
            <div id="edit-bio-status" class="login-status-message"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Terê Verde Online. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
